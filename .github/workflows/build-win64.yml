name: Build Windows

on:
  push:
    branches: [feature/sample-streaming]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calc_ver:
    runs-on: ubuntu-latest
    outputs:
      project_ver: ${{steps.vers.outputs.project_ver}}
      build_ver: ${{steps.vers.outputs.build_ver}}
      full_ver: ${{steps.vers.outputs.full_ver}}
      release_flag: ${{steps.vers.outputs.release_flag}}
      asan_flag: ${{steps.vers.outputs.asan_flag}}
    steps:
    - uses: actions/checkout@v4.1.1
    - name: Calculate versions
      id: vers
      shell: bash
      run: |
        git fetch --prune --unshallow --tags || true
        GIT_VERSION=`git describe --tags 2>/dev/null || echo "3.18.0-0.streaming"`
        PROJECT_VERSION=`echo $GIT_VERSION | cut -d- -f1`
        BUILD_VERSION=`echo $GIT_VERSION | cut -d- -f2-3 --output-delimiter=.`
        echo "project_ver=$PROJECT_VERSION" >>$GITHUB_OUTPUT
        echo "build_ver=$BUILD_VERSION" >>$GITHUB_OUTPUT
        echo "full_ver=$PROJECT_VERSION-$BUILD_VERSION" >>$GITHUB_OUTPUT
        echo "release_flag=ON" >>$GITHUB_OUTPUT
        echo "asan_flag=" >>$GITHUB_OUTPUT
    - name: Display
      run: |
        echo "full_ver=${{steps.vers.outputs.full_ver}}"

  build-win64:
    needs: [calc_ver]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.1.1
      with:
        submodules: true
    - name: Install Dependencies
      run: ${{github.workspace}}/build-scripts/for-win64/prepare-debian-based.sh
    - name: Build
      working-directory: ${{github.workspace}}
      run: >
        ${{github.workspace}}/build-scripts/for-win64/build-on-linux.sh
        ${{needs.calc_ver.outputs.project_ver}}
        ${{needs.calc_ver.outputs.build_ver}}
        ${{github.workspace}}
        ""
        ON
        ""
        ""
    - name: Rename artifacts
      # The build names its output exactly like an official GrandOrgue release.
      # This is an unofficial fork, so give the files a name nobody can mistake
      # for one - including once they are sitting in someone's downloads folder.
      working-directory: ${{github.workspace}}/build/win64
      run: |
        VER="${{needs.calc_ver.outputs.full_ver}}"
        BASE="openpipes-grandorgue-streaming-$VER"
        mkdir -p dist
        for f in grandorgue*; do
          test -f "$f" || continue
          case "$f" in
            *.exe) cp "$f" "dist/$BASE-setup.exe" ;;
            *.zip) cp "$f" "dist/$BASE-portable.zip" ;;
          esac
        done
        ls -lh dist

    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: openpipes-grandorgue-streaming
        path: |
          ${{github.workspace}}/build/win64/dist/*
        if-no-files-found: error

    - name: Publish rolling preview release
      # One moving tag instead of a release per commit, so a link that has been
      # posted somewhere keeps working and always resolves to the newest build.
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      working-directory: ${{github.workspace}}/build/win64/dist
      run: |
        TAG=streaming-preview
        cat > NOTES.md <<'EOF'
        Preview build of GrandOrgue carrying the OpenPipes sample-streaming engine.

        **This is not a GrandOrgue release** and the GrandOrgue project does not
        support it. Report anything wrong here, not upstream:
        https://github.com/bonninr/grandorgue/issues

        Streaming is off by default. Turn it on from the command line:

            GrandOrgue.exe --stream --head-kb 256 "your organ.organ"

        or tick *Stream samples from cache* under Settings -> Options.
        `--head-kb` sets how much of each sample stays in RAM: lower saves more
        memory and leans harder on the disk. Needs an SSD.
        EOF
        gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$TAG" openpipes-* \
          --title "GrandOrgue + streaming engine (OpenPipes preview)" \
          --notes-file NOTES.md \
          --prerelease
        echo "released:"
        gh release view "$TAG" --json url --jq .url